<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Хто я?</title>
<style>
body {
  margin: 0;
  padding: 25px;
  font-family: Arial, sans-serif;
  background: #101820;
  color: white;
  text-align: center;
}
.container {
  max-width: 600px;
  margin: 60px auto;
}
h1 {
  font-size: 48px;
  color: #65d6a3;
}
h2 {
  font-size: 25px;
  line-height: 1.5;
}
p {
  font-size: 19px;
  line-height: 1.6;
}
.counter {
  margin: 40px 0;
  padding: 25px;
  background: #1e3038;
  border-radius: 15px;
}
.number {
  font-size: 48px;
  color: #65d6a3;
  font-weight: bold;
}
button {
  background: #65d6a3;
  color: #101820;
  border: none;
  border-radius: 10px;
  padding: 16px 30px;
  font-size: 20px;
  font-weight: bold;
}
footer {
  margin-top: 70px;
  color: #aab5bb;
}
</style>
</head>
<body>
<div class="container">
  <h1>ХТО Я?</h1>
  <h2>Лише доброта врятує світ!</h2>

  <p>
    Якщо ти вважаєш себе доброю людиною,
    людиною добра або хотів би нею стати —
    тобі сюди!
  </p>

  <div class="counter">
    <p>Нас уже об'єднує одна ідея</p>
    <div class="number">0</div>
    <p>учасників у всьому світі</p>
  </div>

  <button onclick="alert('Незабаром тут з’явиться реєстрація!')">
    ПРИЄДНАТИСЯ
  </button>

  <footer>
    <p>Доброта не має кордонів.</p>
  </footer>
</div>
</body>
</html>
